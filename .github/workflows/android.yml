name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-capacitor, android-app-feel]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run web:build

      - name: Add Android shell files (native shell, back button, app-only CSS)
        run: |
          cp android-shell/native-shell.js build/web/native-shell.js
          cp android-shell/native-shell.css build/web/native-shell.css
          cp android-shell/back-handler.js build/web/back-handler.js
          sed -i 's#</head>#<link rel="stylesheet" href="native-shell.css"></head>#' build/web/index.html
          sed -i 's#</body>#<script src="native-shell.js"></script><script src="back-handler.js"></script></body>#' build/web/index.html
          grep -q native-shell.css build/web/index.html
          grep -q native-shell.js build/web/index.html
          grep -q back-handler.js build/web/index.html

      # Plugins MUST be listed in package.json: `cap sync` finds plugins there, and silently
      # skips anything installed with --no-save (that is why App, Filesystem and Share were
      # missing from the APK). This only changes the CI runner's copy, not the repository.
      - name: Install Capacitor plugins (CI copy of package.json only)
        run: npm install --save-dev --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/splash-screen@7 @capacitor/filesystem@7 @capacitor/share@7

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      # capacitor.plugins.json lists each plugin by npm package ("pkg") and Java class.
      - name: Verify the plugins made it into the APK project
        run: |
          f=android/app/src/main/assets/capacitor.plugins.json
          cat "$f"
          echo
          for p in app splash-screen filesystem share; do
            grep -q "@capacitor/$p" "$f" || { echo "Plugin @capacitor/$p is missing from $f"; exit 1; }
          done

      - name: Dark launch screen (no white flash, no Capacitor logo)
        run: |
          python3 - <<'PY'
          import zlib, struct, glob
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          raw = b'\x00' + bytes([0x0c, 0x0e, 0x14])
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw))
                 + chunk(b'IEND', b''))
          files = glob.glob('android/app/src/main/res/drawable*/splash.png')
          for p in files:
              open(p, 'wb').write(png)
          print('patched', len(files), 'splash images')
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: stykdroid-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
